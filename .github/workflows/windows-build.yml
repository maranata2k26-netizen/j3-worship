name: Windows Release Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/chunks/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct J3 Worship source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work | Out-Null
          $chunks = Get-ChildItem "source/chunks/part*.b64" | Sort-Object Name
          if ($chunks.Count -ne 7) { throw "Expected 7 source chunks, found $($chunks.Count)" }
          $b64 = ($chunks | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("source/J3Worship-source.zip", $bytes)
          $hash = (Get-FileHash "source/J3Worship-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "35d6ddc15d1d93a290bf6e057aedb1b6b1f8bd39bb6414fb844b16bb2c642daf") {
            throw "Source archive integrity check failed: $hash"
          }
          Expand-Archive -Path source/J3Worship-source.zip -DestinationPath work -Force

      - name: Apply Windows validation patch
        shell: pwsh
        run: |
          $cmake = Get-Content "work/CMakeLists.txt" -Raw
          $cmake = $cmake.Replace("project(J3Worship VERSION 0.3.0 LANGUAGES CXX)", "project(J3Worship VERSION 0.3.0 LANGUAGES C CXX)")
          Set-Content "work/CMakeLists.txt" $cmake -Encoding utf8

          $cpp = Get-Content "work/app/MainComponent.cpp" -Raw
          $cpp = $cpp -replace '(?m)^\s*livePage_\.setOpaque\(true\);\r?\n', ''
          $cpp = $cpp -replace '(?m)^\s*livePage_\.setColour\(juce::Component::backgroundColourId, juce::Colour\(panel\)\);\r?\n', ''
          $cpp = $cpp -replace '(?m)^\s*mixerPage_\.setOpaque\(true\);\r?\n', ''
          $cpp = $cpp -replace '(?m)^\s*mixerPage_\.setColour\(juce::Component::backgroundColourId, juce::Colour\(panel\)\);\r?\n', ''
          $cpp = $cpp -replace '(?m)^\s*diagnosticsPage_\.setOpaque\(true\);\r?\n', ''
          $cpp = $cpp -replace '(?m)^\s*diagnosticsPage_\.setColour\(juce::Component::backgroundColourId, juce::Colour\(panel\)\);\r?\n', ''
          $cpp = $cpp.Replace('if (const auto* d = deviceManager_.getCurrentAudioDevice())', 'if (auto* d = deviceManager_.getCurrentAudioDevice())')
          Set-Content "work/app/MainComponent.cpp" $cpp -Encoding utf8

          $rh = Get-Content "work/include/j3/Recording.h" -Raw
          $rh = $rh.Replace('    MultiTrackRecorder() = default;', '    MultiTrackRecorder();')
          $rh = $rh.Replace('    SpscRing<RecordingBlock, 64> queue_;', '    std::unique_ptr<SpscRing<RecordingBlock, 64>> queue_;')
          Set-Content "work/include/j3/Recording.h" $rh -Encoding utf8

          $rcpp = Get-Content "work/src/Recording.cpp" -Raw
          $rcpp = $rcpp.Replace('MultiTrackRecorder::~MultiTrackRecorder(){ std::string ignored; stop(ignored); }', 'MultiTrackRecorder::MultiTrackRecorder() : queue_(std::make_unique<SpscRing<RecordingBlock, 64>>()) {}' + "`n" + 'MultiTrackRecorder::~MultiTrackRecorder(){ std::string ignored; stop(ignored); }')
          $rcpp = $rcpp.Replace('if(!queue_.push(b))', 'if(!queue_->push(b))')
          $rcpp = $rcpp.Replace('||!queue_.empty())', '||!queue_->empty())')
          $rcpp = $rcpp.Replace('if(!queue_.pop(b))', 'if(!queue_->pop(b))')
          Set-Content "work/src/Recording.cpp" $rcpp -Encoding utf8

      - name: Configure Visual Studio x64
        shell: pwsh
        run: cmake -S work -B work/build-win -G "Visual Studio 17 2022" -A x64 -DJ3_BUILD_DESKTOP_APP=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build work/build-win --config Release --parallel

      - name: Run core tests
        shell: pwsh
        run: ctest --test-dir work/build-win -C Release --output-on-failure

      - name: Validate executable
        shell: pwsh
        run: |
          if (Test-Path "work/dist/J3 Worship.exe") {
            Copy-Item "work/dist/J3 Worship.exe" "work/dist/J3Worship.exe" -Force
          }
          if (!(Test-Path "work/dist/J3Worship.exe")) { throw "J3Worship.exe was not produced" }
          Get-Item "work/dist/J3Worship.exe" | Format-List Name,Length,LastWriteTime

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "work\installer\J3Worship.iss"
          if (!(Test-Path "work/dist-installer/J3Worship-Setup.exe")) { throw "Installer was not produced" }

      - name: SHA256
        shell: pwsh
        run: |
          $app = Get-FileHash "work/dist/J3Worship.exe" -Algorithm SHA256
          $setup = Get-FileHash "work/dist-installer/J3Worship-Setup.exe" -Algorithm SHA256
          "J3Worship.exe $($app.Hash)" | Out-File -Encoding ascii "work/dist-installer/SHA256SUMS.txt"
          "J3Worship-Setup.exe $($setup.Hash)" | Out-File -Encoding ascii -Append "work/dist-installer/SHA256SUMS.txt"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: J3Worship-Windows-App
          path: work/dist/J3Worship.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: J3Worship-Windows-Installer
          path: |
            work/dist-installer/J3Worship-Setup.exe
            work/dist-installer/SHA256SUMS.txt
          if-no-files-found: error
