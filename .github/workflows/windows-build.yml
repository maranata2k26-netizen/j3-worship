name: Windows Release Build

on:
  push:
    branches: [main, finish-daw, finish-daw-polish, finish-daw-1.2.0, ui-updater-1.1.0]
    paths:
      - "canonical-current/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "canonical-current/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Visual Studio x64
        shell: pwsh
        run: cmake -S canonical-current -B canonical-current/build-win -G "Visual Studio 17 2022" -A x64 -DJ3_BUILD_DESKTOP_APP=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build canonical-current/build-win --config Release --parallel 2

      - name: Run core tests
        shell: pwsh
        run: ctest --test-dir canonical-current/build-win -C Release --output-on-failure

      - name: Upload UI layout snapshots
        uses: actions/upload-artifact@v4
        with:
          name: J3Worship-UI-Layout-1.4.0
          path: canonical-current/build-win/ui-snapshots/*.png
          if-no-files-found: error

      - name: Validate executable
        shell: pwsh
        run: |
          $exe = "canonical-current/dist/J3Worship.exe"
          if (!(Test-Path $exe)) { throw "J3Worship.exe was not generated" }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "canonical-current/installer/J3Worship.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: End-to-end installer smoke test
        shell: pwsh
        run: |
          $setup = (Resolve-Path "canonical-current/dist-installer/J3Worship-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "J3WorshipSmoke"
          $log = Join-Path $env:RUNNER_TEMP "j3-install.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir","/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "Installer exit code $($p.ExitCode)" }
          $exe = Join-Path $installDir "J3Worship.exe"
          if (!(Test-Path $exe)) { throw "Installed executable missing" }

          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited -and $app.ExitCode -ne 0) { throw "Installed application exited with code $($app.ExitCode)" }
          if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }

          $unins = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $unins)) { throw "Uninstaller missing" }
          $u = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exit code $($u.ExitCode)" }

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash "canonical-current/dist/J3Worship.exe" -Algorithm SHA256
          Get-FileHash "canonical-current/dist-installer/J3Worship-Setup.exe" -Algorithm SHA256

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: J3Worship-Windows-1.4.0
          path: canonical-current/dist/J3Worship.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: J3Worship-Setup-1.4.0
          path: canonical-current/dist-installer/J3Worship-Setup.exe
          if-no-files-found: error
      - name: Publish official GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cmake = Get-Content "canonical-current/CMakeLists.txt" -Raw
          $match = [regex]::Match($cmake, 'project\(J3Worship VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (!$match.Success) { throw "Could not determine J3 Worship version" }
          $version = $match.Groups[1].Value
          $tag = "v$version"
          $setup = (Resolve-Path "canonical-current/dist-installer/J3Worship-Setup.exe").Path
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = "J3 Worship $version`n`nWindows x64 official installer.`nSHA256: $sha"

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag $setup --target "$env:GITHUB_SHA" --title "J3 Worship $version" --notes $notes --repo "$env:GITHUB_REPOSITORY"
          }
