name: Windows Release Build

on:
  push:
    branches: [main, finish-daw, finish-daw-polish, finish-daw-1.2.0, finish-daw-1.7.0, ui-updater-1.1.0]
    paths:
      - "canonical-current/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "canonical-current/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Visual Studio x64
        shell: pwsh
        run: cmake -S canonical-current -B canonical-current/build-win -G "Visual Studio 17 2022" -A x64 -DJ3_BUILD_DESKTOP_APP=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build canonical-current/build-win --config Release --parallel 2

      - name: Run core tests
        shell: pwsh
        run: ctest --test-dir canonical-current/build-win -C Release --output-on-failure

      - name: Upload UI layout snapshots
        uses: actions/upload-artifact@v4
        with:
          name: J3Worship-UI-Layout-1.10.7
          path: canonical-current/build-win/ui-snapshots/*.png
          if-no-files-found: error

      - name: Validate executable
        shell: pwsh
        run: |
          $exe = "canonical-current/dist/J3Worship.exe"
          if (!(Test-Path $exe)) { throw "J3Worship.exe was not generated" }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "canonical-current/installer/J3Worship.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Legacy 1.9 running-executable migration smoke test
        shell: pwsh
        run: |
          $setup = (Resolve-Path "canonical-current/dist-installer/J3Worship-Setup.exe").Path
          $sourceExe = (Resolve-Path "canonical-current/dist/J3Worship.exe").Path
          $legacyDir = Join-Path $env:RUNNER_TEMP "J3WorshipLegacy19Locked"
          $updaterDir = Join-Path $env:TEMP "J3WorshipUpdater"
          $legacyExe = Join-Path $legacyDir "J3Worship.exe"
          New-Item -ItemType Directory -Force -Path $legacyDir | Out-Null
          New-Item -ItemType Directory -Force -Path $updaterDir | Out-Null

          # Use a real running Windows executable renamed as J3Worship.exe so the
          # migration test exercises replacement while the old target is locked/running.
          Copy-Item "$env:WINDIR\System32\ping.exe" $legacyExe -Force
          $legacyProcess = Start-Process -FilePath $legacyExe -ArgumentList "127.0.0.1","-t" -PassThru
          Start-Sleep -Milliseconds 500
          if ($legacyProcess.HasExited) { throw "Could not create running legacy J3Worship.exe test process" }

          $script = Join-Path $updaterDir "apply-update.cmd"
          @(
            '@echo off',
            'timeout /t 2 /nobreak >nul',
            ('start /wait "" "' + $setup + '" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CLOSEAPPLICATIONS'),
            ('start "" "' + $legacyExe + '"'),
            'del "%~f0"'
          ) | Set-Content -Path $script -Encoding ascii

          $log = Join-Path $env:RUNNER_TEMP "j3-legacy19-locked-update.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content (Join-Path $updaterDir "migration-result.txt") -ErrorAction SilentlyContinue
            throw "Legacy 1.9 locked-executable migration failed: $($p.ExitCode)"
          }

          Start-Sleep -Milliseconds 500
          $expected = (Get-FileHash $sourceExe -Algorithm SHA256).Hash
          $actual = (Get-FileHash $legacyExe -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            Get-Content $script -ErrorAction SilentlyContinue
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content (Join-Path $updaterDir "migration-result.txt") -ErrorAction SilentlyContinue
            throw "Legacy 1.9 updater did not replace the running executable it would reopen"
          }

          $migration = Get-Content (Join-Path $updaterDir "migration-result.txt") -Raw
          if ($migration -notmatch '^OK') { throw "Legacy migration marker did not report success" }
          $sourceLine = ($migration -split "`r?`n" | Where-Object { $_ -like 'source=*' } | Select-Object -First 1)
          $targetLine = ($migration -split "`r?`n" | Where-Object { $_ -like 'target=*' } | Select-Object -First 1)
          if (!$sourceLine -or !$targetLine) { throw "Legacy migration marker is incomplete" }
          if ($sourceLine.Substring(7) -eq $targetLine.Substring(7)) { throw "Legacy migration did not use a separate staging executable" }
          if (!$legacyProcess.HasExited) { Stop-Process -Id $legacyProcess.Id -Force -ErrorAction SilentlyContinue }
          Remove-Item $script -Force -ErrorAction SilentlyContinue

      - name: In-place updater target smoke test
        shell: pwsh
        run: |
          $setup = (Resolve-Path "canonical-current/dist-installer/J3Worship-Setup.exe").Path
          $sourceExe = (Resolve-Path "canonical-current/dist/J3Worship.exe").Path
          $updateDir = Join-Path $env:RUNNER_TEMP "J3WorshipUpdateTarget"
          $log1 = Join-Path $env:RUNNER_TEMP "j3-update-first.log"
          $log2 = Join-Path $env:RUNNER_TEMP "j3-update-second.log"

          $first = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$updateDir","/LOG=$log1" -Wait -PassThru
          if ($first.ExitCode -ne 0) { Get-Content $log1 -ErrorAction SilentlyContinue; throw "Initial updater-target install failed: $($first.ExitCode)" }

          $installedExe = Join-Path $updateDir "J3Worship.exe"
          if (!(Test-Path $installedExe)) { throw "Updater-target executable missing after first install" }

          Set-Content -Path $installedExe -Value "stale executable placeholder" -Encoding ascii
          $second = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$updateDir","/LOG=$log2" -Wait -PassThru
          if ($second.ExitCode -ne 0) { Get-Content $log2 -ErrorAction SilentlyContinue; throw "In-place reinstall failed: $($second.ExitCode)" }

          $expected = (Get-FileHash $sourceExe -Algorithm SHA256).Hash
          $actual = (Get-FileHash $installedExe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "In-place updater did not replace the executable in the requested directory" }

      - name: End-to-end installer smoke test
        shell: pwsh
        run: |
          $setup = (Resolve-Path "canonical-current/dist-installer/J3Worship-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "J3WorshipSmoke"
          $log = Join-Path $env:RUNNER_TEMP "j3-install.log"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir","/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "Installer exit code $($p.ExitCode)" }
          $exe = Join-Path $installDir "J3Worship.exe"
          if (!(Test-Path $exe)) { throw "Installed executable missing" }

          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited -and $app.ExitCode -ne 0) { throw "Installed application exited with code $($app.ExitCode)" }
          if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }

          $unins = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $unins)) { throw "Uninstaller missing" }
          $u = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exit code $($u.ExitCode)" }

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash "canonical-current/dist/J3Worship.exe" -Algorithm SHA256
          Get-FileHash "canonical-current/dist-installer/J3Worship-Setup.exe" -Algorithm SHA256

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: J3Worship-Windows-1.10.7
          path: canonical-current/dist/J3Worship.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: J3Worship-Setup-1.10.7
          path: canonical-current/dist-installer/J3Worship-Setup.exe
          if-no-files-found: error
      - name: Publish official GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cmake = Get-Content "canonical-current/CMakeLists.txt" -Raw
          $match = [regex]::Match($cmake, 'project\(J3Worship VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (!$match.Success) { throw "Could not determine J3 Worship version" }
          $version = $match.Groups[1].Value
          $tag = "v$version"
          $setup = (Resolve-Path "canonical-current/dist-installer/J3Worship-Setup.exe").Path
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = "J3 Worship $version`n`nWindows x64 official installer.`nSHA256: $sha"

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag $setup --target "$env:GITHUB_SHA" --title "J3 Worship $version" --notes $notes --repo "$env:GITHUB_REPOSITORY"
          }
